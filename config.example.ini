# ============================================================
#  TOREX ASSIST  -  SETTINGS FILE
# ============================================================
#  This is the ONLY file you normally need to edit.
#  Change the values on the right of the = sign.
#  Do NOT put quotes around words. Do NOT add extra spaces.
#
#  Lines starting with # are comments (the computer ignores them).
# ============================================================


[APP]
# The product's name. This ONE line drives the window title, the startup
# banner, the voice prefix, and how the brain introduces itself.
# When we pick the real name, change it here - zero code.
name = TorexAssist


[USER]
# What should the assistant call you?
name = Torex

# The word that wakes the assistant up. There is exactly ONE wake
# word. IMPORTANT: use SMALL LETTERS only, and only simple words.
# (When the product gets its name this becomes "hey <app-name>".)
wake_word = hey buddy

# Forgiving spellings of the SAME wake word, comma separated.
# The small speech model sometimes mis-hears you; these catch it.
# Leave the value EMPTY to accept only the exact wake word.
# If you change wake_word above, update these to match.
wake_word_variants = hey body, hey budi, hey brody, hey buddy buddy


[VOICE]
# How fast should it talk?  -10 = very slow,  0 = normal,  10 = fast
rate = 2

# Which built-in Windows voice? Leave blank to use the default.
# Common Windows 11 names (write the name exactly as shown):
#     Microsoft David
#     Microsoft Zira
#     Microsoft Mark
#     Microsoft Hazel   (British, nicer sounding)
# Leave this EMPTY if you are not sure:
voice_name =


[AI]
# ----- ONLINE BRAIN (Google Gemini) -----
# Get your free key here:  https://aistudio.google.com/apikey
# Paste it between the quotes below.  ""  means you have not added it yet.
#
# NEVER share this key with anybody. It is like your ATM PIN.
gemini_api_key = ""

# Which Gemini model to use. The free one is fine:
gemini_model = gemini-2.5-flash-lite

# ----- OFFLINE BRAIN (Ollama) -----
# This is the model used when there is no internet (blackout etc).
ollama_model = llama3.2:1b


[WEATHER]
# Put your city here and weather will be instant and correct.
# Example:   city = Lagos
# Leave it EMPTY and the app will guess your city from your internet
# connection (works most of the time, but can be wrong).
city =


[LISTENING]
# How many seconds to wait for you to speak after it wakes up.
listen_timeout = 8

# How loud must a sound be before the app pays attention to it?
# Built-in laptop mic = leave this at 400.
# If it never hears you, lower it to 200.
# If it wakes up by itself too much, raise it to 500.
energy_threshold = 400

# After every answer, how many EXTRA seconds to keep listening
# WITHOUT needing the wake word again (the follow-up window).
# This is what makes a real back-and-forth conversation possible.
# Set it to 0 if you want the wake word before EVERY single thing.
follow_up_window = 8

# Microphone number. Leave at -1 to use the Windows default microphone.
device_index = -1

# WHICH EARS DO THE LISTENING:
#   vosk    = light, transcribes while you speak, weaker in noisy rooms
#   whisper = BIG EARS. OpenAI's pre-trained Whisper (via faster-whisper),
#             about as good as the commercial assistants in noise.
#             It is downloaded ONCE, then runs 100% OFFLINE - your voice
#             NEVER leaves this laptop. Needs:  pip install faster-whisper
#             Trade-off: it thinks 1-2 seconds after you stop talking.
ears_backend = vosk

# Whisper size: tiny (75MB), base (140MB), small (460MB), medium (1.5GB).
# "small" is the sweet spot for a normal laptop. If it feels slow,
# drop to "base".
whisper_model = small

# Where the Vosk listening model lives. ANY Vosk English model works.
# The small one is light and quick; vosk-model-en-us-0.22 (about
# 1.8 GB) hears noticeably better. Relative paths live next to the
# app; you can also give a full absolute path like C:\models\my-vosk
model_folder = models/vosk-model-small-en-us-0.15


[COMMANDS]
# Set to true if you want the app to ASK before shutting down or restarting.
# Strongly recommended. Keep it true.
confirm_dangerous = true


[APPS]
# "open <name>" discovers your apps AUTOMATICALLY from your Start Menu
# shortcuts and your PATH, so normally you need NOTHING in this section.
#
# Use it to ADD an app the discovery cannot find, or OVERRIDE one.
# Format:    spoken name = full path, plain command, or windows: URI
#
# Examples (delete the leading "# " to activate one):
#
# vs code = code
# blender = C:\Program Files\Blender Foundation\Blender 4.2\blender.exe
# edge = msedge
# my notes = notepad C:\Users\You\notes.txt
# settings = ms-settings:
